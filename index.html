<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<script>
  // Apply the saved style before first paint. ?theme=nes etc. also works.
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    try { t = t || localStorage.getItem('rgh-theme'); } catch (e) {}
    if (t) document.documentElement.dataset.theme = t;
  })();
</script>
<title>Retro Game Heardle</title>
<style>
  :root {
    --bg: #14121f; --panel: #1f1c30; --line: #36314f; --text: #ece9f7;
    --muted: #9a94b8; --accent: #7cf2a4; --warn: #ff7a8a; --skip: #f5c96a;
    --hit: #5fd38d; --near: #e8c25a; --miss: #2c2842;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .stats b { color: var(--text); }

  .attempts { display: grid; gap: 6px; margin-bottom: 16px; }
  .attempt {
    min-height: 38px; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    font-size: 14px; color: var(--muted); min-width: 0;
  }
  .attempt .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .attempt.wrong { color: var(--warn); border-color: #5a2c3a; }
  .attempt.wrong .name { color: var(--text); }

  /* Per-guess clue chips: green = match, yellow = close, grey = no. */
  .clues { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .clue {
    border-radius: 6px; padding: 4px 5px; background: var(--miss); color: var(--text);
    font-size: 12px; line-height: 1.2; min-width: 0;
  }
  .clue .k { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .6px; opacity: .7; }
  .clue .v { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .clue.hit { background: var(--hit); color: #0f2418; }
  .clue.near { background: var(--near); color: #2a1f05; }

  .known {
    display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px;
    border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
  }
  .known[hidden] { display: none; }
  .known .k { color: var(--muted); }
  .known .v.found { color: var(--accent); }
  .attempt.skipped { color: var(--skip); border-color: #5a4a2c; }
  .attempt.right { color: var(--accent); border-color: #2c5a3e; }

  .bar { position: relative; height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .bar .unlocked { position: absolute; inset: 0 auto 0 0; background: #3a3456; }
  .bar .progress { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--bg); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .times .silent { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }

  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 11px 14px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #10201a; border-color: var(--accent); font-weight: 600; }
  #play { grid-column: 1 / -1; }

  .guess { position: relative; display: flex; gap: 8px; }
  .guess input {
    flex: 1; font: inherit; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); min-width: 0;
  }
  .guess input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .suggestions {
    position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    max-height: 240px; overflow-y: auto; display: none; z-index: 5;
  }
  .suggestions div { padding: 9px 12px; cursor: pointer; font-size: 14px; }
  .suggestions small { color: var(--muted); }
  .suggestions div.active, .suggestions div:hover { background: #2c2845; }

  .result {
    display: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-top: 16px; background: var(--panel);
  }
  .result h2 { margin: 0 0 4px; font-size: 18px; }
  .result .meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .result.win h2 { color: var(--accent); }
  .result.lose h2 { color: var(--warn); }
  .result .row { display: flex; gap: 8px; }
  .result .row button { flex: 1; }

  .note { color: var(--muted); font-size: 12px; margin-top: 18px; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .link { background: none; border: 0; color: var(--muted); padding: 4px 0; font-size: 13px; text-decoration: underline; }
  .filters {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    padding: 12px; margin-bottom: 16px; display: grid; gap: 10px; font-size: 14px;
  }
  .filters[hidden] { display: none; }
  .filters .plats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; }
  .filters .years { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters input[type=number] {
    width: 80px; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .filters .count { color: var(--muted); font-size: 12px; }

  .hint { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .hint[hidden] { display: none; }
  .cover {
    width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: var(--panel);
    flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; transition: filter .4s; }
  .hint .letter { font-size: 14px; color: var(--muted); }
  .hint .letter b { color: var(--text); font-size: 20px; }
  .series-badge {
    display: inline-block; margin-left: 8px; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--near); color: #2a1f05; vertical-align: 1px;
  }
  .result .cover { width: 120px; height: 120px; margin-bottom: 10px; }
  .result .cover img { filter: none; }
  /* The YouTube player has to exist to play audio, but nobody needs to see it. */
  #player-wrap { position: fixed; left: -9999px; top: 0; width: 200px; height: 200px; }

  /* ---------- Theme picker ---------- */
  .themes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: -8px 0 16px; }
  .themes button { padding: 4px 9px; font-size: 12px; }
  .themes button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ---------- Theme: Arcade (neon CRT) ---------- */
  [data-theme=arcade] {
    --bg: #07021a; --panel: #110833; --line: #ff2bd6; --text: #eafcff;
    --muted: #9d8fe0; --accent: #00f0ff; --warn: #ff3b6b; --skip: #ffe14d;
    --hit: #39ff88; --near: #ffd23f; --miss: #1d1250;
  }
  [data-theme=arcade] body {
    font: 21px/1.15 "VT323", monospace;
    background: radial-gradient(ellipse at 50% 0%, #2a0b5e 0%, var(--bg) 60%) fixed;
    min-height: 100vh;
  }
  [data-theme=arcade] body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    box-shadow: inset 0 0 120px rgba(0,0,0,.8);
  }
  [data-theme=arcade] h1 {
    font: 17px/1.4 "Press Start 2P", monospace; color: #ff5ce1;
    text-shadow: 0 0 6px #ff2bd6, 0 0 18px #ff2bd6, 3px 3px 0 #2b0a6b;
    animation: flicker 4s infinite; margin-top: 6px;
  }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1 } 93% { opacity: .6 } 95% { opacity: 1 } 96% { opacity: .75 } }
  [data-theme=arcade] .sub { color: var(--accent); text-shadow: 0 0 6px var(--accent); font-size: 19px; }
  [data-theme=arcade] .stats, [data-theme=arcade] .times, [data-theme=arcade] .note { font-size: 18px; }
  [data-theme=arcade] .stats b { color: var(--near); text-shadow: 0 0 6px var(--near); }
  [data-theme=arcade] button, [data-theme=arcade] .attempt, [data-theme=arcade] .clue, [data-theme=arcade] .guess input,
  [data-theme=arcade] .result, [data-theme=arcade] .filters, [data-theme=arcade] .known, [data-theme=arcade] .cover,
  [data-theme=arcade] .suggestions, [data-theme=arcade] .bar { border-radius: 0; }
  [data-theme=arcade] button {
    font: 10px/1.4 "Press Start 2P", monospace; padding: 13px 8px; border: 2px solid var(--accent);
    background: transparent; color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,.45), inset 0 0 8px rgba(0,240,255,.25);
    text-transform: uppercase;
  }
  [data-theme=arcade] button.primary { background: var(--line); border-color: #ff8bec; color: #fff; box-shadow: 0 0 14px #ff2bd6; }
  [data-theme=arcade] .link, [data-theme=arcade] .times .silent { border: 0; box-shadow: none; padding: 4px 0; font-size: 9px; color: var(--muted); background: none; }
  [data-theme=arcade] .attempt { border: 2px solid #3b2a85; font-size: 20px; }
  [data-theme=arcade] .attempt.wrong { border-color: var(--warn); box-shadow: 0 0 6px rgba(255,59,107,.4); }
  [data-theme=arcade] .clue { font-size: 17px; }
  [data-theme=arcade] .clue .k { font-size: 12px; }
  [data-theme=arcade] .clue.hit { box-shadow: 0 0 8px var(--hit); }
  [data-theme=arcade] .bar { height: 14px; border: 2px solid var(--line); background: #000; }
  [data-theme=arcade] .bar .unlocked { background: #2b1866; }
  [data-theme=arcade] .bar .progress { background: linear-gradient(90deg, #00f0ff, #ff2bd6); box-shadow: 0 0 10px #00f0ff; }
  [data-theme=arcade] .guess input { border: 2px solid var(--accent); background: #000; font-size: 22px; }
  [data-theme=arcade] .suggestions div { font-size: 20px; }
  [data-theme=arcade] .suggestions div.active, [data-theme=arcade] .suggestions div:hover { background: #2b1866; }
  [data-theme=arcade] .result { border: 2px solid var(--line); box-shadow: 0 0 18px rgba(255,43,214,.4); }
  [data-theme=arcade] .result h2 { font: 14px/1.5 "Press Start 2P", monospace; }
  [data-theme=arcade] .result.win h2 { text-shadow: 0 0 10px var(--accent); }
  [data-theme=arcade] .themes button { font-size: 8px; padding: 7px 8px; }

  /* ---------- Theme: 8-bit (NES dialog boxes) ---------- */
  [data-theme=nes] {
    --bg: #000; --panel: #000; --line: #fcfcfc; --text: #fcfcfc;
    --muted: #bcbcbc; --accent: #f83800; --warn: #f83800; --skip: #f8b800;
    --hit: #00a800; --near: #f8b800; --miss: #3c3c3c;
  }
  [data-theme=nes] body { font: 11px/1.8 "Press Start 2P", monospace; image-rendering: pixelated; }
  [data-theme=nes] h1 { font-size: 15px; line-height: 1.5; color: #f8b800; text-shadow: 3px 3px 0 #a81000; }
  [data-theme=nes] .sub, [data-theme=nes] .stats, [data-theme=nes] .times, [data-theme=nes] .note { font-size: 9px; }
  [data-theme=nes] .stats { flex-wrap: wrap; gap: 8px 14px; }
  [data-theme=nes] .attempt, [data-theme=nes] .result, [data-theme=nes] .filters, [data-theme=nes] .known,
  [data-theme=nes] .guess input, [data-theme=nes] .suggestions {
    border: 4px double var(--line); border-radius: 6px; font-size: 10px;
  }
  [data-theme=nes] .attempt.wrong { border-color: #fcfcfc; }
  [data-theme=nes] .attempt.wrong .name::before { content: "✗ "; color: var(--warn); }
  [data-theme=nes] .attempt.right .name::before { content: "▶ "; }
  [data-theme=nes] .clue { border-radius: 0; font-size: 8px; padding: 4px; }
  [data-theme=nes] .clue .k { font-size: 6px; letter-spacing: 0; }
  [data-theme=nes] .clue.near { color: #000; }
  [data-theme=nes] button {
    font: 9px/1.5 "Press Start 2P", monospace; border-radius: 0; padding: 12px 6px;
    background: #fcfcfc; color: #000; border: 3px solid #000; outline: 3px solid #fcfcfc;
    box-shadow: inset -3px -3px 0 #7c7c7c; margin: 3px;
  }
  [data-theme=nes] button:active { box-shadow: inset 3px 3px 0 #7c7c7c; }
  [data-theme=nes] button.primary { background: #f83800; color: #fcfcfc; box-shadow: inset -3px -3px 0 #a81000; }
  [data-theme=nes] .link, [data-theme=nes] .times .silent { outline: 0; border: 0; box-shadow: none; background: none; color: var(--muted); font-size: 8px; padding: 4px 0; margin: 0; }
  [data-theme=nes] .bar { height: 16px; border-radius: 0; border: 3px solid #fcfcfc; background: #000; }
  [data-theme=nes] .bar .unlocked { background: #0000bc; }
  [data-theme=nes] .bar .progress { background: repeating-linear-gradient(90deg, #f83800 0 8px, #000 8px 10px); }
  [data-theme=nes] .bar .tick { background: #fcfcfc; width: 2px; }
  [data-theme=nes] .guess input { font-size: 10px; background: #000; }
  [data-theme=nes] .guess input:focus { outline: 0; border-color: #f8b800; }
  [data-theme=nes] .suggestions div { font-size: 9px; }
  [data-theme=nes] .suggestions div.active, [data-theme=nes] .suggestions div:hover { background: #0000bc; }
  [data-theme=nes] .suggestions div.active::before { content: "▶ "; }
  [data-theme=nes] .result h2 { font-size: 12px; line-height: 1.6; }
  [data-theme=nes] .result .meta { font-size: 9px; }
  [data-theme=nes] .cover { border-radius: 0; border: 3px solid #fcfcfc; }
  [data-theme=nes] .cover img { image-rendering: pixelated; }
  [data-theme=nes] .hint .letter { font-size: 9px; }
  [data-theme=nes] .series-badge { border-radius: 0; font-size: 7px; }
  [data-theme=nes] .themes button { font-size: 7px; padding: 6px; }

  /* ---------- Theme: PC (late-90s desktop window) ---------- */
  [data-theme=pc] {
    --bg: #c0c0c0; --panel: #c0c0c0; --line: #808080; --text: #000;
    --muted: #404040; --accent: #000080; --warn: #a00000; --skip: #806000;
    --hit: #008000; --near: #ffff00; --miss: #fff;
  }
  [data-theme=pc] body { background: #008080; font: 14px/1.35 Tahoma, Verdana, "Segoe UI", sans-serif; }
  [data-theme=pc] main {
    margin: 16px; padding: 0 10px 14px; background: #c0c0c0; align-self: flex-start;
    border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
  }
  [data-theme=pc] .top { margin: 3px -7px 6px; padding: 3px 4px 3px 6px; background: linear-gradient(90deg, #000080, #1084d0); color: #fff; align-items: center; }
  [data-theme=pc] h1 { font-size: 14px; font-weight: bold; margin: 0; }
  [data-theme=pc] h1::before { content: "♫ "; }
  [data-theme=pc] .sub { color: #dfe8ff; font-size: 11px; margin: 0; }
  [data-theme=pc] .link { color: #000; background: #c0c0c0; text-decoration: none; padding: 2px 8px; font-size: 12px; }
  [data-theme=pc] .times .silent { border: 0; box-shadow: none; background: none; color: #000080; padding: 0; text-decoration: underline; }
  [data-theme=pc] button {
    border-radius: 0; background: #c0c0c0; color: #000; padding: 8px 10px; font-size: 13px;
    border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
  }
  [data-theme=pc] button:active:not(:disabled) { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 #808080; }
  [data-theme=pc] button.primary { font-weight: bold; outline: 1px dotted #000; outline-offset: -5px; color: #000; background: #c0c0c0; }
  [data-theme=pc] button:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; opacity: 1; }
  [data-theme=pc] .attempt, [data-theme=pc] .guess input, [data-theme=pc] .known, [data-theme=pc] .cover, [data-theme=pc] .bar {
    border-radius: 0; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 1px 1px 0 #000;
  }
  [data-theme=pc] .attempt.wrong .name { color: #000; }
  [data-theme=pc] .clue { border-radius: 0; border: 1px solid #808080; }
  [data-theme=pc] .clue.hit { color: #fff; }
  [data-theme=pc] .clue.near { color: #000; }
  [data-theme=pc] .bar { height: 20px; }
  [data-theme=pc] .bar .unlocked { background: #e6e6e6; }
  [data-theme=pc] .bar .progress { background: repeating-linear-gradient(90deg, #000080 0 9px, transparent 9px 11px); }
  [data-theme=pc] .bar .tick { background: #c0c0c0; }
  [data-theme=pc] .guess input:focus { outline: 1px dotted #000; }
  [data-theme=pc] .suggestions { border-radius: 0; background: #fff; border: 1px solid #000; }
  [data-theme=pc] .suggestions div.active, [data-theme=pc] .suggestions div:hover { background: #000080; color: #fff; }
  [data-theme=pc] .suggestions div.active small, [data-theme=pc] .suggestions div:hover small { color: #dfe8ff; }
  [data-theme=pc] .result, [data-theme=pc] .filters {
    border-radius: 0; background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 #808080;
  }
  [data-theme=pc] .result h2 { font-size: 15px; }
  [data-theme=pc] .result.win h2 { color: #000080; }
  [data-theme=pc] .filters input[type=number] { border-radius: 0; background: #fff; border: 2px inset #fff; }
  [data-theme=pc] .themes button { padding: 3px 8px; font-size: 12px; }
  [data-theme=pc] .themes { margin-top: 0; }
  [data-theme=pc] .clue .k { letter-spacing: 0; }
  [data-theme=pc] .themes button.on { background: #c0c0c0; color: #000; border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 #808080; font-weight: bold; }

  /* ---------- Shared polish ---------- */
  html { background: var(--bg); }
  html[data-theme=pc] { background: #008080; }
  button, input { -webkit-tap-highlight-color: transparent; }
  .attempt.empty { border-style: dashed; opacity: .55; min-height: 34px; }
  @keyframes blink { 50% { opacity: 0 } }

  [data-theme=arcade] { accent-color: #00f0ff; }
  [data-theme=arcade] body { background: radial-gradient(ellipse 120% 60% at 50% 0%, #2a0b5e 0%, var(--bg) 70%) no-repeat, var(--bg); }
  [data-theme=arcade] h1 { font-size: 15px; }
  [data-theme=arcade] .sub::after { content: "_"; animation: blink 1s steps(1) infinite; }
  [data-theme=arcade] .link, [data-theme=arcade] .times .silent { font-size: 10px; }
  [data-theme=arcade] .themes button { font-size: 9px; }
  [data-theme=arcade] .attempt.empty { border: 2px dashed #3b2a85; opacity: .7; }
  [data-theme=arcade] .attempt.right { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,240,255,.5); }
  [data-theme=arcade] .filters input[type=number] { border-radius: 0; border: 2px solid var(--line); background: #000; font: inherit; }
  [data-theme=arcade] .hint .letter b { color: var(--near); text-shadow: 0 0 8px var(--near); font-size: 26px; }
  [data-theme=arcade] .cover { border: 2px solid var(--accent); box-shadow: 0 0 10px rgba(0,240,255,.4); }

  [data-theme=nes] { accent-color: #f83800; }
  [data-theme=nes] .clue { font-size: 9px; }
  [data-theme=nes] .clue .k { font-size: 7px; }
  [data-theme=nes] .attempt.empty { border: 3px solid #3c3c3c; opacity: 1; }
  [data-theme=nes] button.primary:not(:disabled)::before { content: "▶ "; animation: blink 1s steps(1) infinite; }
  [data-theme=nes] .filters, [data-theme=nes] .filters label { font-size: 10px; }
  [data-theme=nes] .filters input[type=number] { border-radius: 0; border: 3px solid #fcfcfc; background: #000; font: inherit; }
  [data-theme=nes] .known .v.found { color: #f8b800; }

  [data-theme=pc] { accent-color: #000080; }
  [data-theme=pc] .stats { gap: 3px; }
  [data-theme=pc] .stats span { flex: 1; padding: 2px 6px; font-size: 12px; border: 1px solid; border-color: #808080 #fff #fff #808080; }
  [data-theme=pc] .attempt.empty { background: #dcdcdc; border-style: solid; opacity: 1; }
  [data-theme=pc] .attempt.right .name { font-weight: bold; }
  [data-theme=pc] .result h2::before { content: "✔ "; }
  [data-theme=pc] .result.lose h2::before { content: "✖ "; }

  /* ---------- Calmer pass: keep the look, cut the noise ---------- */
  /* Arcade: one readable font for text, glow only where it matters, softer scanlines. */
  [data-theme=arcade] { --line: #4a2f8f; --muted: #a99fd6; --hit: #2fd27a; --near: #f2c94c; }
  [data-theme=arcade] body { font: 15px/1.45 "Space Mono", ui-monospace, monospace; }
  [data-theme=arcade] body::after { background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px); box-shadow: inset 0 0 80px rgba(0,0,0,.5); }
  [data-theme=arcade] h1 { animation: none; text-shadow: 0 0 10px rgba(255,43,214,.6), 2px 2px 0 #2b0a6b; }
  [data-theme=arcade] .sub { font-size: 13px; text-shadow: none; }
  [data-theme=arcade] .stats, [data-theme=arcade] .times, [data-theme=arcade] .note { font-size: 13px; }
  [data-theme=arcade] .stats b { text-shadow: none; }
  [data-theme=arcade] .attempt { font-size: 14px; border: 1px solid var(--line); }
  [data-theme=arcade] .attempt.wrong { border-color: #7a2d55; box-shadow: none; }
  [data-theme=arcade] .attempt.right { box-shadow: none; }
  [data-theme=arcade] .attempt.empty { border: 1px dashed #33226a; }
  [data-theme=arcade] .clue { font-size: 12px; }
  [data-theme=arcade] .clue .k { font-size: 9px; }
  [data-theme=arcade] .clue.hit { box-shadow: none; }
  [data-theme=arcade] button { font: 9px/1.4 "Press Start 2P", monospace; border: 1px solid #1fa8b8; box-shadow: none; padding: 13px 6px; }
  [data-theme=arcade] button.primary { box-shadow: 0 0 12px rgba(255,43,214,.45); border-color: var(--line); background: #d61fb3; }
  [data-theme=arcade] .guess input { font-size: 15px; border: 1px solid #1fa8b8; }
  [data-theme=arcade] .suggestions div { font-size: 14px; }
  [data-theme=arcade] .known { border-color: var(--line); }
  [data-theme=arcade] .result { border: 1px solid var(--line); box-shadow: none; }
  [data-theme=arcade] .cover { border: 1px solid #1fa8b8; box-shadow: none; }
  [data-theme=arcade] .bar { border: 1px solid var(--line); }
  [data-theme=arcade] .bar .progress { box-shadow: none; }
  [data-theme=arcade] .filters { border-color: var(--line); }
  [data-theme=arcade] .filters input[type=number] { border: 1px solid var(--line); }
  [data-theme=arcade] .hint .letter b { text-shadow: none; }

  /* PC: guesses live in one list box instead of a stack of bevelled boxes. */
  [data-theme=pc] .attempts {
    gap: 0; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 1px 1px 0 #000;
  }
  [data-theme=pc] .attempt, [data-theme=pc] .attempt.empty {
    border: 0; box-shadow: none; background: transparent; border-bottom: 1px solid #e4e4e4; min-height: 36px;
  }
  [data-theme=pc] .attempt:last-child { border-bottom: 0; }
  [data-theme=pc] .clue { border: 0; background: #ececec; }
  [data-theme=pc] .clue.hit { background: #2e8b2e; }
  [data-theme=pc] .clue.near { background: #ffe873; }
  [data-theme=pc] .known { background: transparent; box-shadow: none; border: 1px solid #808080; outline: 1px solid #fff; outline-offset: -2px; }
  [data-theme=pc] .known .v.found { color: #000080; font-weight: bold; }
  [data-theme=pc] .series-badge { background: #ffe873; }
  [data-theme=pc] main { box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf, 4px 4px 0 rgba(0,0,0,.25); }

  /* ---------- Daily / practice ---------- */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .modes button { padding: 8px; }
  .modes button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  [data-theme=pc] .modes button.on { background: #c0c0c0; color: #000; border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 #808080; font-weight: bold; }
  .modes[hidden], .daylabel:empty { display: none; }
  .daylabel { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .daylabel b { color: var(--text); }
  .daylabel.preview { color: var(--near); }
  .controls.daily { grid-template-columns: repeat(2, 1fr); }
  .controls.daily #new { display: none; }
  .result .nextday { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .result .nextday:empty { display: none; }
  #r-share[hidden], #r-next[hidden], #filters-toggle[hidden] { display: none; }

  /* ---------- Clue tooltip ---------- */
  .clue { cursor: help; }
  .tip {
    position: absolute; z-index: 30; max-width: 240px; padding: 7px 10px; font-size: 13px; line-height: 1.35;
    background: var(--text); color: var(--bg); border-radius: 6px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .tip[hidden] { display: none; }
  [data-theme=arcade] .tip { font-family: "Space Mono", monospace; font-size: 12px; background: #00f0ff; color: #07021a; border-radius: 0; }
  [data-theme=nes] .tip { font-family: "Press Start 2P", monospace; font-size: 8px; line-height: 1.7; background: #000; color: #fcfcfc; border: 3px double #fcfcfc; border-radius: 0; }
  [data-theme=pc] .tip { background: #ffffe1; color: #000; border: 1px solid #000; border-radius: 0; box-shadow: 2px 2px 0 rgba(0,0,0,.3); font-size: 12px; }

  /* ---------- Footer + feedback ---------- */
  .foot { margin-top: 28px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; }
  .foot .link { font-size: 12px; }
  .foot .link[hidden] { display: none; }
  #fb { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(420px, 92vw); padding: 16px; }
  #fb::backdrop { background: rgba(0,0,0,.6); }
  #fb form { display: grid; gap: 10px; }
  #fb .fb-sub { margin: 0; font-size: 13px; color: var(--muted); }
  #fb textarea, #fb input { font: inherit; font-size: 15px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #fb .fb-row { display: flex; gap: 8px; align-items: center; }
  #fb #fb-status { flex: 1; font-size: 12px; color: var(--muted); }
  [data-theme=pc] #fb, [data-theme=arcade] #fb, [data-theme=nes] #fb { border-radius: 0; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Retro Game Heardle</h1>
      <div class="sub">Guess the game from its music.</div>
    </div>
    <button class="link" id="filters-toggle">Filters</button>
  </div>
  <div class="modes" id="modes">
    <button id="m-daily">Daily</button>
    <button id="m-practice">Practice</button>
  </div>
  <div class="daylabel" id="daylabel"></div>
  <div class="themes" id="themes">Style:
    <button data-t="classic">Classic</button>
    <button data-t="arcade">Arcade</button>
    <button data-t="nes">8-bit</button>
    <button data-t="pc">PC</button>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="plats" id="f-plats"></div>
    <div class="years">
      <label for="f-from">From</label><input type="number" id="f-from">
      <label for="f-to">to</label><input type="number" id="f-to">
    </div>
    <div class="count" id="f-count"></div>
  </div>
  <div class="stats">
    <span>Played <b id="s-played">0</b></span>
    <span>Won <b id="s-won">0</b></span>
    <span>Streak <b id="s-streak">0</b></span>
    <span>Best <b id="s-best">0</b></span>
  </div>

  <div class="known" id="known" hidden></div>
  <div class="attempts" id="attempts"></div>

  <div class="bar" id="bar"><div class="unlocked" id="unlocked"></div><div class="progress" id="progress"></div></div>
  <div class="times"><span id="t-now">0:00</span><button class="silent" id="silent">Intro or silence? Skip ahead</button><span id="t-max">0:22</span></div>

  <div class="controls">
    <button id="play" class="primary" disabled>Loading…</button>
    <button id="skip" disabled>Skip (+1s)</button>
    <button id="hint-btn" disabled>Hint</button>
    <button id="new">New song</button>
  </div>

  <div class="hint" id="hint" hidden>
    <div class="cover" id="hint-cover"></div>
    <div class="letter" id="hint-letter"></div>
  </div>

  <div class="guess">
    <div class="suggestions" id="suggestions"></div>
    <input id="input" placeholder="Type a game…" autocomplete="off" disabled>
    <button id="submit" disabled>Guess</button>
  </div>

  <div class="result" id="result">
    <div class="cover" id="r-cover"></div>
    <h2 id="r-title"></h2>
    <div class="meta" id="r-meta"></div>
    <div class="row">
      <button id="r-listen">Play full song</button>
      <button id="r-share" class="primary">Share</button>
      <button id="r-next" class="primary">Next song</button>
    </div>
    <div class="nextday" id="r-nextday"></div>
  </div>

  <div class="note" id="note"></div>
  <div id="player-wrap"><div id="player"></div></div>
  <footer class="foot">
    Unofficial fan project. All music belongs to its composers and publishers.
    <button class="link" id="fb-open" hidden>Send feedback</button>
  </footer>
</main>

<div class="tip" id="tip" hidden></div>
<dialog id="fb">
  <form id="fb-form">
    <b>Feedback</b>
    <p class="fb-sub">Bug, wrong song, idea? It goes straight to the maker.</p>
    <textarea id="fb-msg" rows="5" required placeholder="What's up?"></textarea>
    <input id="fb-contact" placeholder="Your email (optional, if you want a reply)">
    <div class="fb-row">
      <span id="fb-status"></span>
      <button type="button" id="fb-cancel">Cancel</button>
      <button type="submit" class="primary" id="fb-send">Send</button>
    </div>
  </form>
</dialog>

<script src="songs.js"></script>
<script src="games.js"></script>
<script src="daily.js"></script>
<script>
const STAGES = [2, 4, 7, 11, 16, 22];
const MAX = STAGES[STAGES.length - 1];
// Many uploads open with a beat of silence, so songs without a set start skip the first second.
const LEAD_IN = 1;
// Per-song extra skip, added when the player taps "Intro or silence? Skip ahead".
let offsets = load('rgh-offsets', {});
function startOf(s) { return (s.start || LEAD_IN) + (offsets[s.videoId] || 0); }
const RECENT_KEEP = 40;

const $ = id => document.getElementById(id);
const games = [...new Set(SONGS.map(s => s.game))].sort((a, b) => a.localeCompare(b));

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// Modes: 'daily' (one song per day, same for everyone) or 'practice' (endless, filterable).
const params = new URLSearchParams(location.search);
const preview = params.get('preview') === '1' && DAILY.isKey(params.get('date'));
let mode = params.get('mode') === 'practice' && !preview ? 'practice' : 'daily';
let dayKey = preview ? params.get('date') : DAILY.today();
let schedule = {};
let won = false;
const statsKey = () => mode === 'daily' ? 'rgh-dstats' : 'rgh-stats';
const blankStats = () => ({ played: 0, won: 0, streak: 0, best: 0 });
let stats = load(statsKey(), blankStats());
let recent = load('rgh-recent', []);
let broken = new Set(load('rgh-broken', []));

let player, ready = false;
let song = null, stage = 0, attempts = [], over = false, hints = 0;
const HINT_STEPS = 3;   // 1: very blurred cover, 2: less blurred, 3: first letter
let filters = load('rgh-filters', null);
let stopTimer = null, tickTimer = null, fullListen = false;

function renderStats() {
  $('s-played').textContent = stats.played;
  $('s-won').textContent = stats.won;
  $('s-streak').textContent = stats.streak;
  $('s-best').textContent = stats.best;
}

function renderBar() {
  const bar = $('bar');
  bar.querySelectorAll('.tick').forEach(t => t.remove());
  for (const s of STAGES.slice(0, -1)) {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = (s / MAX * 100) + '%';
    bar.appendChild(t);
  }
  $('unlocked').style.width = (STAGES[stage] / MAX * 100) + '%';
}

// Everything we know about a game, merged from songs.js and games.js.
const INFO = {};
for (const s of SONGS) {
  if (!INFO[s.game]) INFO[s.game] = { platforms: s.platform.split('/'), year: s.year, ...GAMES[s.game] };
}

const overlap = (a, b) => a.filter(x => b.includes(x));
const sameSet = (a, b) => a.length === b.length && overlap(a, b).length === a.length;

// Compare a guessed game with the answer, one clue per column.
function compare(guessName, answerName) {
  const g = INFO[guessName], a = INFO[answerName];
  const clue = (k, v, state) => ({ k, v, state });
  const plat = sameSet(g.platforms, a.platforms) ? 'hit' : overlap(g.platforms, a.platforms).length ? 'near' : '';
  const dy = a.year - g.year;
  const arrow = dy > 0 ? ' ↑' : dy < 0 ? ' ↓' : '';
  const genre = sameSet(g.genre, a.genre) ? 'hit' : overlap(g.genre, a.genre).length ? 'near' : '';
  return [
    clue('Platform', g.platforms.join('/'), plat),
    clue('Year', g.year + arrow, dy === 0 ? 'hit' : Math.abs(dy) <= 2 ? 'near' : ''),
    clue('Genre', g.genre[g.genre.length - 1], genre),
    clue('Studio', g.developer, g.developer === a.developer ? 'hit' : ''),
    clue('Series', g.series || 'None', g.series && g.series === a.series ? 'hit' : ''),
  ];
}

// What a clue chip's colour means, shown on hover or tap.
const TIPS = {
  Platform: { hit: 'Same platform as the answer.', near: 'Shares a platform with the answer, but not all of them.', '': 'Different platform.' },
  Year: { hit: 'Same year!', near: 'Within 2 years. The arrow points to the answer: ↑ newer, ↓ older.', '': 'More than 2 years off. ↑ means the answer is newer, ↓ older.' },
  Genre: { hit: 'Same genre.', near: 'Overlapping genre (for example both RPGs), but not the same kind.', '': 'Different genre.' },
  Studio: { hit: 'Same studio.', near: '', '': 'Different studio.' },
  Series: { hit: 'Same series!', near: '', '': 'Different series.' },
};
const clueTip = c => `${c.k}: ${c.v}. ${(TIPS[c.k] || {})[c.state] || ''}`;
function showTip(chip) {
  const tip = $('tip');
  tip.textContent = chip.dataset.tip;
  tip.hidden = false;
  const r = chip.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (window.scrollY + r.top - tip.offsetHeight - 6) + 'px';
}
function hideTip() { $('tip').hidden = true; }
document.addEventListener('pointerover', e => { const c = e.target.closest('.clue'); if (c && e.pointerType === 'mouse') showTip(c); });
document.addEventListener('pointerout', e => { if (e.target.closest('.clue') && e.pointerType === 'mouse') hideTip(); });
document.addEventListener('click', e => { const c = e.target.closest('.clue'); if (c) showTip(c); else hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });

function renderAttempts() {
  const box = $('attempts');
  box.innerHTML = '';
  for (let i = 0; i < STAGES.length; i++) {
    const a = attempts[i];
    const div = document.createElement('div');
    div.className = 'attempt' + (a ? ' ' + a.kind : ' empty');
    if (a) {
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = a.kind === 'skipped' ? 'Skipped' : a.text;
      if (a.series) {
        const badge = document.createElement('span');
        badge.className = 'series-badge';
        badge.textContent = 'Right series!';
        name.appendChild(badge);
      }
      div.appendChild(name);
    }
    if (a && a.kind === 'wrong') {
      const row = document.createElement('div');
      row.className = 'clues';
      for (const c of compare(a.text, song.game)) {
        const chip = document.createElement('div');
        chip.className = 'clue ' + c.state;
        chip.dataset.tip = clueTip(c);
        chip.tabIndex = 0;
        chip.innerHTML = '<span class="k"></span><span class="v"></span>';
        chip.children[0].textContent = c.k;
        chip.children[1].textContent = c.v;
        row.appendChild(chip);
      }
      div.appendChild(row);
    }
    box.appendChild(div);
  }
  renderKnown();
}

// Sum up what the wrong guesses have revealed so far.
function renderKnown() {
  const box = $('known');
  const wrong = attempts.filter(a => a.kind === 'wrong').map(a => INFO[a.text]);
  if (!wrong.length || over) { box.hidden = true; return; }
  const ans = INFO[song.game];
  const years = Object.values(INFO).map(i => i.year);
  let lo = Math.min(...years), hi = Math.max(...years);
  for (const g of wrong) {
    if (g.year === ans.year) { lo = hi = ans.year; break; }
    if (ans.year > g.year) lo = Math.max(lo, g.year + 1);
    else hi = Math.min(hi, g.year - 1);
  }
  const plat = wrong.some(g => sameSet(g.platforms, ans.platforms)) ? { v: ans.platforms.join('/'), found: true }
    : (() => {
        const seen = [...new Set(wrong.flatMap(g => overlap(g.platforms, ans.platforms)))];
        return seen.length ? { v: 'includes ' + seen.join(', ') } : { v: 'not ' + [...new Set(wrong.flatMap(g => g.platforms))].join(', ') };
      })();
  const genreHit = wrong.find(g => sameSet(g.genre, ans.genre));
  const genreSeen = [...new Set(wrong.flatMap(g => overlap(g.genre, ans.genre)))];
  const genre = genreHit ? { v: ans.genre.join(', '), found: true }
    : genreSeen.length ? { v: genreSeen.join(', ') + ' …' } : { v: '?' };
  const dev = wrong.some(g => g.developer === ans.developer) ? { v: ans.developer, found: true } : { v: '?' };
  const ser = ans.series && wrong.some(g => g.series === ans.series) ? { v: ans.series, found: true } : { v: '?' };
  const rows = [
    ['Platform', plat],
    ['Year', lo === hi ? { v: String(lo), found: true } : { v: `${lo}–${hi}` }],
    ['Genre', genre],
    ['Studio', dev],
    ['Series', ser],
  ];
  box.innerHTML = '';
  for (const [k, val] of rows) {
    const kd = document.createElement('div'); kd.className = 'k'; kd.textContent = k;
    const vd = document.createElement('div'); vd.className = 'v' + (val.found ? ' found' : ''); vd.textContent = val.v;
    box.append(kd, vd);
  }
  box.hidden = false;
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

function setControls() {
  const canPlay = ready && song;
  $('play').disabled = !canPlay;
  $('play').textContent = canPlay ? `Play ${STAGES[stage]}s` : 'Loading…';
  $('skip').disabled = !canPlay || over || stage >= STAGES.length - 1;
  const nextGain = STAGES[stage + 1] - STAGES[stage];
  $('skip').textContent = stage < STAGES.length - 1 ? `Skip (+${nextGain}s)` : 'Skip';
  $('input').disabled = !canPlay || over;
  $('submit').disabled = !canPlay || over;
  $('hint-btn').disabled = !song || over || hints >= HINT_STEPS;
  $('hint-btn').textContent = hints >= HINT_STEPS ? 'No hints left' : `Hint (${HINT_STEPS - hints})`;
}

const ALL_PLATFORMS = ['NES', 'PS1', 'PS2', 'PC'];
const YEAR_MIN = Math.min(...SONGS.map(s => s.year)), YEAR_MAX = Math.max(...SONGS.map(s => s.year));
if (!filters) filters = { platforms: ALL_PLATFORMS.slice(), from: YEAR_MIN, to: YEAR_MAX };

function matchesFilters(s) {
  const plats = s.platform.split('/');
  return plats.some(p => filters.platforms.includes(p)) && s.year >= filters.from && s.year <= filters.to;
}

function setupFilters() {
  const box = $('f-plats');
  for (const p of ALL_PLATFORMS) {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" id="f-${p}"> ${p}`;
    box.appendChild(label);
    const cb = label.querySelector('input');
    cb.checked = filters.platforms.includes(p);
    cb.onchange = () => {
      filters.platforms = ALL_PLATFORMS.filter(x => $('f-' + x).checked);
      filtersChanged();
    };
  }
  for (const id of ['f-from', 'f-to']) {
    const el = $(id);
    el.min = YEAR_MIN; el.max = YEAR_MAX;
    el.value = id === 'f-from' ? filters.from : filters.to;
    el.onchange = () => {
      filters.from = Number($('f-from').value) || YEAR_MIN;
      filters.to = Number($('f-to').value) || YEAR_MAX;
      filtersChanged();
    };
  }
  $('filters-toggle').onclick = () => { $('filters').hidden = !$('filters').hidden; };
  renderFilterCount();
}
function renderFilterCount() {
  const n = SONGS.filter(matchesFilters).length;
  $('f-count').textContent = n ? `${n} songs match` : 'No songs match, so all songs will be used.';
}
function filtersChanged() {
  save('rgh-filters', filters);
  renderFilterCount();
  // Start a fresh round if the current song no longer fits.
  if (song && !matchesFilters(song) && !attempts.length) newRound();
}

function pickSong() {
  let pool = SONGS.filter(s => !broken.has(s.videoId) && matchesFilters(s));
  if (!pool.length) pool = SONGS.filter(s => !broken.has(s.videoId));
  if (!pool.length) { broken.clear(); save('rgh-broken', []); pool = SONGS; }
  const todays = DAILY.pick(DAILY.today(), SONGS, schedule).song;
  if (pool.length > 1) pool = pool.filter(s => s.game !== todays.game);
  let fresh = pool.filter(s => !recent.includes(s.videoId));
  if (!fresh.length) { recent = []; fresh = pool; }
  // Pick a game first, then one of its songs, so games with more tracks don't come up more often.
  const gameList = [...new Set(fresh.map(s => s.game))];
  const g = gameList[Math.floor(Math.random() * gameList.length)];
  const songs = fresh.filter(s => s.game === g);
  return songs[Math.floor(Math.random() * songs.length)];
}

function newRound() {
  stopPlayback();
  stage = 0; attempts = []; over = false; won = false; fullListen = false; hints = 0;
  if (mode === 'daily') {
    song = DAILY.pick(dayKey, SONGS, schedule).song;
    const saved = preview ? null : load('rgh-daily', null);
    if (saved && saved.key === dayKey && saved.videoId === song.videoId) {
      attempts = saved.attempts; hints = saved.hints; over = saved.over; won = saved.won;
      stage = Math.min(attempts.length, STAGES.length - 1);
    }
  } else {
    song = pickSong();
    recent.push(song.videoId);
    recent = recent.slice(-RECENT_KEEP);
    save('rgh-recent', recent);
  }
  renderMode();
  $('result').style.display = 'none';
  $('input').value = '';
  $('note').textContent = '';
  renderAttempts(); renderBar(); setControls(); renderHint();
  getCover(song.game);
  $('progress').style.width = '0';
  $('t-now').textContent = '0:00';
  if (ready) player.cueVideoById({ videoId: song.videoId, startSeconds: startOf(song) });
  if (over) finish(won, true);
}

// Remember today's progress so a reload doesn't reset the daily puzzle.
function saveDaily() {
  if (mode !== 'daily' || preview) return;
  save('rgh-daily', { key: dayKey, videoId: song.videoId, attempts, hints, over, won });
}

function renderMode() {
  $('m-daily').classList.toggle('on', mode === 'daily');
  $('m-practice').classList.toggle('on', mode === 'practice');
  $('modes').hidden = preview;
  const daily = mode === 'daily';
  document.querySelector('.controls').classList.toggle('daily', daily);
  $('filters-toggle').hidden = daily;
  if (daily) $('filters').hidden = true;
  $('r-share').hidden = !daily;
  $('r-next').hidden = daily && preview;
  $('r-next').textContent = daily ? 'Practice mode' : 'Next song';
  const label = $('daylabel');
  const date = new Date(dayKey + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  label.className = 'daylabel' + (preview ? ' preview' : '');
  if (!daily) label.textContent = 'Practice: endless songs, use Filters to narrow them down.';
  else label.innerHTML = (preview ? 'Preview of ' : '') + `<b>Daily #${DAILY.number(dayKey)}</b> · ${date}` + (preview ? ' (nothing is saved)' : '');
}

function setMode(m) {
  if (m === mode || preview) return;
  mode = m;
  stats = load(statsKey(), blankStats());
  renderStats();
  const url = new URL(location.href);
  if (m === 'practice') url.searchParams.set('mode', 'practice'); else url.searchParams.delete('mode');
  history.replaceState(null, '', url);
  newRound();
}

function stopPlayback() {
  clearTimeout(stopTimer); clearInterval(tickTimer);
  if (ready && player.pauseVideo) player.pauseVideo();
}

function play() {
  if (!ready || !song) return;
  stopPlayback();
  fullListen = false;
  const len = over ? MAX : STAGES[stage];
  const start = startOf(song);
  player.seekTo(start, true);
  player.playVideo();
  // Stop by the video's own position rather than a wall-clock timer, so buffering
  // doesn't eat into the clip. Right after seekTo the player can still report the
  // old position, so ignore it until we've seen the seek land near the start.
  let seeked = false;
  tickTimer = setInterval(() => {
    // Only count while the video is actually playing (state 1), never while it buffers.
    if (player.getPlayerState() !== 1) return;
    const t = player.getCurrentTime() - start;
    if (!seeked) {
      if (t > -0.5 && t < 0.5) seeked = true;
      else return;
    }
    const shown = Math.min(Math.max(t, 0), len);
    $('progress').style.width = (shown / MAX * 100) + '%';
    $('t-now').textContent = fmt(shown);
    if (t >= len) stopPlayback();
  }, 50);
  // Safety net in case the player never reports progress.
  stopTimer = setTimeout(stopPlayback, (len + 15) * 1000);
}

function advance(entry) {
  attempts.push(entry);
  saveDaily();
  if (stage < STAGES.length - 1 && attempts.length < STAGES.length) {
    stage++;
    renderAttempts(); renderBar(); setControls();
  } else {
    renderAttempts();
    finish(false);
  }
}

function guess(text) {
  if (over || !text.trim()) return;
  const match = games.find(g => g.toLowerCase() === text.trim().toLowerCase());
  if (!match) { $('note').textContent = 'Pick a game from the list.'; return; }
  $('note').textContent = '';
  $('input').value = '';
  hideSuggestions();
  if (match === song.game) {
    attempts.push({ kind: 'right', text: match });
    saveDaily();
    renderAttempts();
    finish(true);
  } else {
    const series = INFO[match].series;
    advance({ kind: 'wrong', text: match, series: !!series && series === INFO[song.game].series });
  }
}

function finish(didWin, restoring = false) {
  over = true; won = didWin;
  if (!restoring && !preview) {
    if (mode === 'daily') {
      if (stats.lastPlayed !== dayKey) {
        stats.played++;
        if (won) {
          stats.won++;
          stats.streak = stats.lastWin === DAILY.addDays(dayKey, -1) ? stats.streak + 1 : 1;
          stats.lastWin = dayKey;
          stats.best = Math.max(stats.best, stats.streak);
        } else stats.streak = 0;
        stats.lastPlayed = dayKey;
      }
    } else {
      stats.played++;
      if (won) { stats.won++; stats.streak++; stats.best = Math.max(stats.best, stats.streak); }
      else stats.streak = 0;
    }
    save(statsKey(), stats);
    saveDaily();
  }
  renderStats(); renderKnown(); renderAttempts(); renderHint();
  stage = STAGES.length - 1; renderBar(); setControls();
  const r = $('result');
  r.className = 'result ' + (won ? 'win' : 'lose');
  $('r-title').textContent = song.game;
  const extras = [];
  if (won) extras.push(`got it in ${attempts.length}`);
  else if (attempts.some(a => a.series)) extras.push(`you had the series (${INFO[song.game].series})`);
  if (hints) extras.push(`${hints} hint${hints > 1 ? 's' : ''}`);
  $('r-meta').textContent = [`${song.track} · ${song.platform} · ${song.year}`, ...extras].join(' · ');
  $('hint').hidden = true;
  showCover($('r-cover'), song.game, 0);
  r.style.display = 'block';
  startCountdown();
}

// Time until tomorrow's song, shown under a finished daily puzzle.
let countdownTimer = null;
function startCountdown() {
  clearInterval(countdownTimer);
  const box = $('r-nextday');
  if (mode !== 'daily' || preview) { box.textContent = ''; return; }
  const tick = () => {
    if (DAILY.today() !== dayKey) { box.textContent = 'A new song is ready. Reload to play it.'; clearInterval(countdownTimer); return; }
    const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
    const sec = Math.floor((mid - now) / 1000);
    box.textContent = `Next song in ${Math.floor(sec / 3600)}h ${String(Math.floor(sec / 60) % 60).padStart(2, '0')}m ${String(sec % 60).padStart(2, '0')}s`;
  };
  tick(); countdownTimer = setInterval(tick, 1000);
}

function shareText() {
  const cells = [];
  for (let i = 0; i < STAGES.length; i++) {
    const a = attempts[i];
    cells.push(!a ? '⬜' : a.kind === 'right' ? '🟩' : a.kind === 'skipped' ? '⬛' : a.series ? '🟨' : '🟥');
  }
  const score = won ? `${attempts.length}/${STAGES.length}` : `X/${STAGES.length}`;
  const extra = hints ? ` 💡${hints}` : '';
  return `${document.title} #${DAILY.number(dayKey)} ${score}${extra}\n🎵${cells.join('')}\n${location.origin}${location.pathname}`;
}
$('r-share').onclick = async () => {
  const text = shareText();
  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); $('note').textContent = 'Result copied. Paste it anywhere.'; }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    try { await navigator.clipboard.writeText(text); $('note').textContent = 'Result copied. Paste it anywhere.'; }
    catch { $('note').textContent = text; }
  }
};

// Covers come from Wikipedia at runtime: search for the game's article and use its
// lead image, which for games is almost always the box art.
let covers = load('rgh-covers2', {});
const coverRequests = {};
function getCover(game) {
  if (game in covers) return Promise.resolve(covers[game]);
  if (coverRequests[game]) return coverRequests[game];
  const url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
    '&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(game + ' video game') +
    '&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any';
  return coverRequests[game] = fetch(url).then(r => r.json()).then(data => {
    const page = Object.values(data.query?.pages || {})[0];
    const src = page?.thumbnail?.source || null;
    covers[game] = src;
    save('rgh-covers2', covers);
    return src;
  }).catch(() => null);
}

function showCover(box, game, blur) {
  box.textContent = '…';
  getCover(game).then(src => {
    if (!song || song.game !== game) return;
    box.textContent = '';
    if (!src) { box.textContent = 'No cover found'; return; }
    const img = document.createElement('img');
    img.alt = '';
    img.src = src;
    img.style.filter = blur ? `blur(${blur}px)` : 'none';
    img.onerror = () => { box.textContent = 'No cover found'; };
    box.appendChild(img);
  });
}

function renderHint() {
  const box = $('hint');
  box.hidden = hints === 0 || over;
  if (box.hidden) return;
  showCover($('hint-cover'), song.game, hints === 1 ? 5 : 2);
  const letter = $('hint-letter');
  if (hints >= 3) {
    letter.innerHTML = 'Starts with <b></b> (ignoring “The”)';
    letter.querySelector('b').textContent = song.game.replace(/^The /, '')[0];
  } else {
    letter.textContent = hints === 1 ? 'Tap Hint again for a clearer cover.' : 'One more hint: the first letter.';
  }
}

function giveUp() {
  if (mode === 'daily') return;
  // "New song" mid-round counts as a loss so the streak means something.
  if (song && !over && attempts.length) { stats.played++; stats.streak = 0; save('rgh-stats', stats); renderStats(); }
  newRound();
}

// Autocomplete
let active = -1;
function showSuggestions() {
  const q = $('input').value.trim().toLowerCase();
  const box = $('suggestions');
  if (!q) { hideSuggestions(); return; }
  const hits = games.filter(g => g.toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = '';
  hits.forEach((g, i) => {
    const d = document.createElement('div');
    d.textContent = g;
    d.dataset.game = g;
    const m = document.createElement('small');
    m.textContent = `  ${INFO[g].platforms.join('/')} · ${INFO[g].year}`;
    d.appendChild(m);
    d.onmousedown = e => { e.preventDefault(); guess(g); };
    box.appendChild(d);
  });
  active = -1;
  box.style.display = hits.length ? 'block' : 'none';
}
function hideSuggestions() { $('suggestions').style.display = 'none'; active = -1; }
function moveActive(dir) {
  const items = [...$('suggestions').children];
  if (!items.length) return;
  active = (active + dir + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle('active', i === active));
  items[active].scrollIntoView({ block: 'nearest' });
}

$('input').addEventListener('input', showSuggestions);
$('input').addEventListener('blur', () => setTimeout(hideSuggestions, 100));
$('input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
  else if (e.key === 'Enter') {
    const items = [...$('suggestions').children];
    if (active >= 0 && items[active]) guess(items[active].dataset.game);
    else if (items.length === 1) guess(items[0].dataset.game);
    else guess($('input').value);
  } else if (e.key === 'Escape') hideSuggestions();
});
$('submit').onclick = () => {
  const items = [...$('suggestions').children];
  guess(items.length === 1 && $('suggestions').style.display !== 'none' ? items[0].dataset.game : $('input').value);
};
$('play').onclick = play;
$('hint-btn').onclick = () => { if (hints < HINT_STEPS) { hints++; saveDaily(); renderHint(); setControls(); } };
$('skip').onclick = () => advance({ kind: 'skipped' });
$('new').onclick = giveUp;
$('r-next').onclick = () => mode === 'daily' ? setMode('practice') : newRound();
$('m-daily').onclick = () => setMode('daily');
$('m-practice').onclick = () => setMode('practice');
$('silent').onclick = () => {
  if (!song) return;
  offsets[song.videoId] = (offsets[song.videoId] || 0) + 3;
  save('rgh-offsets', offsets);
  $('note').textContent = 'Skipping 3 more seconds into this song.';
  play();
};
$('r-listen').onclick = () => {
  stopPlayback();
  fullListen = true;
  player.seekTo(startOf(song), true);
  player.playVideo();
};

// YouTube player
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: 200, height: 200,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: () => {
        ready = true;
        if (song) player.cueVideoById({ videoId: song.videoId, startSeconds: startOf(song) });
        setControls();
      },
      onError: e => {
        // Removed, private, or not embeddable: remember it and move on.
        console.warn('Unplayable video', song && song.videoId, e.data);
        if (mode === 'daily') { $('note').textContent = "Today's song won't play right now. Try reloading, or play Practice meanwhile."; return; }
        if (song) { broken.add(song.videoId); save('rgh-broken', [...broken]); }
        $('note').textContent = `Skipped a song that wouldn't play (${song ? song.game : ''}).`;
        const msg = $('note').textContent;
        newRound();
        $('note').textContent = msg;
      }
    }
  });
}

// Feedback goes to a Formspree form, which forwards it by email. The address never
// appears on the page. Paste the form's endpoint here to turn the button on.
const FEEDBACK_URL = '';
function setupFeedback() {
  if (!FEEDBACK_URL) return;
  $('fb-open').hidden = false;
  $('fb-open').onclick = () => { $('fb-status').textContent = ''; $('fb').showModal(); $('fb-msg').focus(); };
  $('fb-cancel').onclick = () => $('fb').close();
  $('fb-form').onsubmit = async e => {
    e.preventDefault();
    $('fb-send').disabled = true; $('fb-status').textContent = 'Sending…';
    const context = mode === 'daily' ? `Daily #${DAILY.number(dayKey)}` : 'Practice';
    try {
      const r = await fetch(FEEDBACK_URL, {
        method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: $('fb-msg').value, email: $('fb-contact').value || undefined,
          context, song: over || mode === 'practice' ? `${song.game} – ${song.track} (${song.videoId})` : '(daily, not finished)',
          theme: document.documentElement.dataset.theme || 'classic', page: location.href,
        }),
      });
      if (!r.ok) throw new Error(r.status);
      $('fb-msg').value = ''; $('fb-status').textContent = 'Thanks! Sent.';
      setTimeout(() => $('fb').close(), 1200);
    } catch { $('fb-status').textContent = "Couldn't send. Try again later."; }
    finally { $('fb-send').disabled = false; }
  };
}
setupFeedback();

function setupThemes() {
  const mark = () => document.querySelectorAll('#themes button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === (document.documentElement.dataset.theme || 'classic')));
  document.querySelectorAll('#themes button').forEach(b => b.onclick = () => {
    if (b.dataset.t === 'classic') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = b.dataset.t;
    try { localStorage.setItem('rgh-theme', b.dataset.t); } catch (e) {}
    mark();
  });
  mark();
}
setupThemes();
renderStats();
setupFilters();
DAILY.loadSchedule().then(s => { schedule = s; newRound(); });
if (location.protocol === 'file:') {
  $('note').textContent = 'YouTube may refuse to play when this file is opened directly. Serve it over http (see README).';
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
